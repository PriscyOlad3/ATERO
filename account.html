<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account | ATERO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-white text-gray-800 flex flex-col min-h-screen">

  <header class="py-6 px-6 max-w-7xl mx-auto w-full flex flex-col md:flex-row justify-between items-center gap-4">
    <a href="index.html" class="text-4xl font-bold tracking-widest brand-font uppercase text-black">ATERO</a>
    <nav class="flex space-x-8 font-bold text-sm tracking-wide">
      <a href="index.html" class="hover:text-red-600 transition pb-1">HOME</a>
      <a href="shop.html" class="hover:text-red-600 transition pb-1">SHOP</a>
      <a href="about.html" class="hover:text-red-600 transition pb-1">ABOUT</a>
    </nav>
    <div class="flex items-center space-x-6 text-xl">
      <a href="account.html" class="text-gray-500 transition"><i class="fa-solid fa-user"></i></a>
      <a href="checkout.html" class="relative hover:text-gray-500 transition">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
      </a>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-4 text-sm text-gray-500 border-t w-full border-gray-100">
    <a href="index.html" class="hover:text-black">Home</a> > 
    <span class="text-black font-semibold">Account</span>
  </div>

  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md bg-white border border-gray-200 p-8 shadow-sm">
      
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold brand-font text-black mb-2">Welcome Back</h1>
        <p class="text-sm text-gray-500">Sign in to your ATERO account.</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-700">Email Address</label>
          <input type="email" placeholder="Enter your email" class="w-full border border-gray-300 p-3 outline-none focus:border-black text-sm transition" required>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-xs text-gray-500 hover:text-black underline">Forgot password?</a>
          </div>
          <input type="password" placeholder="Enter your password" class="w-full border border-gray-300 p-3 outline-none focus:border-black text-sm transition" required>
        </div>
        
        <button type="submit" class="w-full bg-black text-white font-bold py-3 mt-4 hover:bg-gray-800 transition text-sm tracking-wider">
          SIGN IN
        </button>
      </form>

      <div class="mt-8 text-center text-sm border-t border-gray-200 pt-6">
        <p class="text-gray-600 mb-3">Don't have an account?</p>
        <button onclick="alert('Account creation is temporarily paused while we upgrade our systems. Please checkout as a guest!')" class="w-full border border-black text-black font-bold py-3 hover:bg-gray-50 transition text-sm tracking-wider">
          CREATE ACCOUNT
        </button>
      </div>

    </div>
  </main>

  <footer class="bg-black text-white py-12 mt-auto text-center w-full">
    <h2 class="text-3xl font-bold tracking-widest brand-font uppercase mb-4">ATERO</h2>
    <p class="text-xs text-gray-500">&copy; 2026 ATERO. All rights reserved.</p>
  </footer>

  <script>
    // Update Cart Counter
    function updateCartCount() {
      let cart = JSON.parse(localStorage.getItem('atero_cart')) || [];
      document.getElementById('cart-count').innerText = cart.length;
    }
    updateCartCount();

    // Handle fake login
    function handleLogin(event) {
      event.preventDefault(); // Prevents the page from refreshing
      alert("Welcome to ATERO! This feature is currently in showcase mode.");
    }
  </script>

</body>
</html>
