<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout | ATERO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #fafafa; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
    .input-field { border: 1px solid #d1d5db; padding: 0.75rem; border-radius: 4px; width: 100%; outline: none; font-size: 0.875rem; }
    .input-field:focus { border-color: #000; }
  </style>
</head>
<body class="text-gray-800">

  <header class="py-6 px-6 max-w-7xl mx-auto flex justify-between items-center border-b border-gray-200">
    <a href="index.html" class="text-3xl font-bold tracking-widest brand-font uppercase text-black">ATERO</a>
    <a href="shop.html" class="text-sm font-semibold hover:text-gray-500"><i class="fa-solid fa-arrow-left mr-2"></i> Continue Shopping</a>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-4 text-xs text-gray-500">
    <a href="index.html" class="hover:text-black">Home</a> > <a href="#" class="hover:text-black">Cart</a> > <span class="text-black font-semibold">Checkout</span>
  </div>

  <section class="max-w-7xl mx-auto px-6 my-8 grid grid-cols-1 lg:grid-cols-12 gap-12">
    
    <div class="lg:col-span-7 space-y-10">
      
      <div>
        <h2 class="text-2xl font-semibold mb-4">Contact Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="first-name" placeholder="First name" class="input-field">
          <input type="text" id="last-name" placeholder="Last name" class="input-field">
          <input type="email" id="email" placeholder="Email address" class="input-field">
          <input type="tel" id="phone" placeholder="Phone number" class="input-field">
        </div>
      </div>

      <div>
        <h2 class="text-2xl font-semibold mb-4">Delivery Method</h2>
        <div class="space-y-3">
          <label class="flex items-center justify-between border border-black p-4 rounded cursor-pointer bg-white">
            <div class="flex items-center"><input type="radio" name="delivery" class="mr-3" checked> <span class="font-medium text-sm">Standard delivery (5-6 days)</span></div>
            <span class="font-bold text-sm">FREE</span>
          </label>
          <label class="flex items-center justify-between border border-gray-300 p-4 rounded cursor-pointer bg-white hover:border-black">
            <div class="flex items-center"><input type="radio" name="delivery" class="mr-3"> <span class="font-medium text-sm">Express delivery (1-2 days)</span></div>
            <span class="font-bold text-sm">$15.00</span>
          </label>
        </div>
      </div>

      <div>
        <h2 class="text-2xl font-semibold mb-4">Shipping Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="country" placeholder="Country" class="input-field">
          <input type="text" id="city" placeholder="City" class="input-field">
          <input type="text" id="address" placeholder="Address" class="input-field">
          <input type="text" id="postal" placeholder="Postal code" class="input-field">
        </div>
      </div>
    </div>

    <div class="lg:col-span-5">
      <h2 class="text-2xl font-semibold mb-4">Order Summary</h2>
      
      <div class="bg-white border border-gray-200 rounded p-6">
        
        <div id="cart-items-container" class="space-y-6 mb-6">
          </div>

        <div class="space-y-3 text-sm border-t border-gray-200 pt-6">
          <div class="flex justify-between"><span class="text-gray-600">Subtotal</span><span id="subtotal" class="font-semibold">$0.00</span></div>
          <div class="flex justify-between"><span class="text-gray-600">Delivery cost</span><span class="font-semibold">FREE</span></div>
          <div class="flex justify-between font-bold text-lg mt-4 pt-4 border-t border-gray-200">
            <span>Total to pay</span>
            <span id="total-price">$0.00</span>
          </div>
        </div>

        <button onclick="checkoutToWhatsApp()" class="w-full mt-6 bg-black text-white py-3 font-bold rounded hover:bg-gray-800 transition">Place Order via WhatsApp</button>
        <p class="text-[10px] text-gray-500 text-center mt-3"><i class="fa-solid fa-lock mr-1"></i> By proceeding I accept the Terms & Conditions</p>

      </div>
    </div>

  </section>

  <footer class="bg-black text-white py-12 mt-16 text-center">
    <h2 class="text-3xl font-bold tracking-widest brand-font uppercase mb-4">ATERO</h2>
    <p class="text-xs text-gray-500">&copy; 2026 ATERO. All rights reserved.</p>
  </footer>

  <script>
    // 1. Load cart from memory
    let rawCart = JSON.parse(localStorage.getItem('atero_cart')) || [];
    let cart = [];

    // 2. Consolidate items and set defaults (Quantity, Size, Color)
    rawCart.forEach(item => {
      let existing = cart.find(i => i.name === item.name);
      if (existing) { existing.quantity += 1; } 
      else { cart.push({...item, quantity: 1, size: 'M', color: 'Black'}); }
    });

    // Save consolidated cart back to memory
    function saveCart() {
      localStorage.setItem('atero_cart', JSON.stringify(cart));
      renderCart();
    }

    // 3. Render Cart HTML
    function renderCart() {
      const container = document.getElementById('cart-items-container');
      
      if (cart.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-6">Your cart is currently empty.</p>';
        document.getElementById('subtotal').innerText = "$0.00";
        document.getElementById('total-price').innerText = "$0.00";
        return;
      }

      let cartHTML = '';
      let totalAmount = 0;

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.quantity;
        totalAmount += itemTotal;

        cartHTML += `
          <div class="flex gap-4 items-start border-b border-gray-100 pb-6">
            <img src="${item.image}" class="w-20 h-24 object-cover rounded bg-gray-100">
            <div class="flex-1">
              <div class="flex justify-between">
                <h4 class="font-bold text-sm">${item.name}</h4>
                <span class="font-bold text-sm">$${itemTotal.toFixed(2)}</span>
              </div>
              
              <div class="flex gap-2 mt-2">
                <select onchange="updateDetail(${index}, 'size', this.value)" class="text-xs border border-gray-300 rounded p-1 outline-none">
                  <option value="S" ${item.size === 'S' ? 'selected' : ''}>Size: S</option>
                  <option value="M" ${item.size === 'M' ? 'selected' : ''}>Size: M</option>
                  <option value="L" ${item.size === 'L' ? 'selected' : ''}>Size: L</option>
                  <option value="XL" ${item.size === 'XL' ? 'selected' : ''}>Size: XL</option>
                </select>
                <select onchange="updateDetail(${index}, 'color', this.value)" class="text-xs border border-gray-300 rounded p-1 outline-none">
                  <option value="Black" ${item.color === 'Black' ? 'selected' : ''}>Color: Black</option>
                  <option value="Red" ${item.color === 'Red' ? 'selected' : ''}>Color: Red</option>
                  <option value="White" ${item.color === 'White' ? 'selected' : ''}>Color: White</option>
                  <option value="Blue" ${item.color === 'Blue' ? 'selected' : ''}>Color: Blue</option>
                  <option value="Brown" ${item.color === 'Brown' ? 'selected' : ''}>Color: Brown</option>
                </select>
              </div>

              <div class="flex justify-between items-center mt-3">
                <div class="flex items-center border border-gray-300 rounded text-sm">
                  <button onclick="changeQty(${index}, -1)" class="px-3 py-1 hover:bg-gray-100 transition">-</button>
                  <span class="px-3 border-x border-gray-300">${item.quantity}</span>
                  <button onclick="changeQty(${index}, 1)" class="px-3 py-1 hover:bg-gray-100 transition">+</button>
                </div>
                <button onclick="removeItem(${index})" class="text-xs text-red-600 underline font-semibold hover:text-red-800">Remove</button>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = cartHTML;
      document.getElementById('subtotal').innerText = `$${totalAmount.toFixed(2)}`;
      document.getElementById('total-price').innerText = `$${totalAmount.toFixed(2)}`;
    }

    // 4. Change Quantity Function
    function changeQty(index, change) {
      cart[index].quantity += change;
      if (cart[index].quantity < 1) cart[index].quantity = 1; // Prevent going below 1
      saveCart();
    }

    // 5. Update Size/Color Function
    function updateDetail(index, type, value) {
      cart[index][type] = value;
      saveCart();
    }

    // 6. Remove Item Function
    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
    }

    // Run on load
    renderCart();
  </script>

</body>
</html>
