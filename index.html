<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATERO - Master your climate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-gray-800">

  <div class="bg-gray-100 text-xs py-2 px-6 flex justify-between items-center border-b border-gray-200 hidden md:flex">
    <div class="font-medium text-red-600">
      HOT <span class="text-gray-600 ml-1">| Free Express Shipping on ATERO orders over $2000</span>
    </div>
    <div class="flex items-center space-x-4 text-gray-500">
      <select class="bg-transparent outline-none cursor-pointer"><option>English</option></select>
      <select class="bg-transparent outline-none cursor-pointer"><option>USD ($)</option></select>
      <div class="flex space-x-4 ml-4 border-l pl-4 border-gray-300 text-sm">
        <a href="#" class="hover:text-black transition"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="hover:text-black transition"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="hover:text-black transition"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="hover:text-black transition"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://tiktok.com/@wearatero" target="_blank" class="hover:text-black transition"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>
  </div>

  <header class="py-6 px-6 max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    <a href="index.html" class="text-4xl font-bold tracking-widest brand-font uppercase text-black">ATERO</a>
    <div class="flex w-full md:w-1/3 border-2 border-black rounded overflow-hidden">
      <input type="text" placeholder="Search..." class="w-full px-4 py-2 outline-none text-sm">
      <button class="bg-black text-white px-4 py-2 hover:bg-gray-800 transition"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="flex items-center space-x-6 text-xl">
      <a href="account.html" class="hover:text-gray-500 transition"><i class="fa-regular fa-user"></i></a>
      <a href="checkout.html" class="relative hover:text-gray-500 transition">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
      </a>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 mb-4 relative z-50">
    <div class="flex flex-col md:flex-row items-start md:items-center gap-6 border-b border-gray-200 pb-4">
      <div class="relative">
        <button onclick="document.getElementById('category-menu').classList.toggle('hidden')" class="bg-black text-white px-6 py-3 font-bold flex items-center gap-2 rounded hover:bg-gray-800 transition w-full md:w-auto">
          <i class="fa-solid fa-bars"></i> MENU
        </button>
        <ul id="category-menu" class="hidden absolute top-full left-0 mt-2 w-64 bg-white border border-gray-200 shadow-xl rounded flex flex-col text-sm font-medium z-50">
          <li><a href="nightwears.html" class="block px-4 py-3 border-b hover:bg-gray-50 hover:text-red-600 transition">Nightwears</a></li>
          <li><a href="#" class="block px-4 py-3 border-b hover:bg-gray-50 hover:text-red-600 transition">Kids</a></li>
          <li><a href="#" class="block px-4 py-3 border-b hover:bg-gray-50 hover:text-red-600 transition">Men Wears</a></li>
          <li><a href="#" class="block px-4 py-3 hover:bg-gray-50 hover:text-red-600 transition">Female Wears</a></li>
        </ul>
      </div>
      <nav class="flex flex-wrap gap-x-8 gap-y-2 font-bold text-sm tracking-wide mt-2 md:mt-0">
        <a href="index.html" class="text-red-600 border-b-2 border-red-600 pb-1">HOME</a>
        <a href="shop.html" class="hover:text-red-600 transition pb-1">SHOP</a>
        <a href="#" class="hover:text-red-600 transition pb-1">THE SCIENCE</a>
        <a href="about.html" class="hover:text-red-600 transition pb-1">ABOUT US</a>
        <a href="#" class="hover:text-red-600 transition pb-1">CONTACT US</a>
      </nav>
    </div>
  </div>

  <section class="max-w-7xl mx-auto px-6 mb-16 relative z-10">
    <div class="relative w-full h-[400px] md:h-[500px] bg-gray-200 rounded overflow-hidden flex items-center">
      <img src="images/nightwear-2.jpg" class="absolute inset-0 w-full h-full object-cover object-top opacity-90">
      <div class="absolute inset-0 bg-gradient-to-r from-black/80 to-transparent"></div>
      <div class="relative z-10 pl-10 md:pl-16 max-w-lg text-white">
        <h2 class="text-4xl md:text-5xl font-bold mb-4 brand-font leading-tight">Midnight Cocoa Lounge Set</h2>
        <a href="nightwears.html" class="inline-block bg-white text-black font-bold px-8 py-3 rounded text-sm tracking-wider hover:bg-gray-200 transition">SHOP COLLECTION</a>
      </div>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-6 my-16 pt-8 relative z-10 border-t border-gray-200">
    <h2 class="text-2xl font-bold brand-font mb-8">Popular Categories</h2>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-6 text-center">
      <a href="nightwears.html" class="block hover:opacity-80 transition">
        <img src="images/nightwear-6.jpg" class="w-24 h-24 mx-auto rounded-full object-cover mb-3 shadow">
        <p class="text-sm font-semibold">Nightwears</p>
      </a>
      <a href="shop.html" class="block hover:opacity-80 transition flex flex-col justify-center items-center h-full">
        <div class="w-24 h-24 mx-auto rounded-full bg-gray-100 flex items-center justify-center mb-3 shadow text-gray-400">
          <i class="fa-solid fa-arrow-right text-2xl"></i>
        </div>
        <p class="text-sm font-semibold text-gray-600">View All</p>
      </a>
    </div>
  </section>

  <footer class="bg-black text-white py-12 mt-16 text-center">
    <h2 class="text-3xl font-bold tracking-widest brand-font uppercase mb-4">ATERO</h2>
    <p class="text-xs text-gray-500">&copy; 2026 ATERO. All rights reserved.</p>
  </footer>

  <script>
    function updateCartCount() {
      let cart = JSON.parse(localStorage.getItem('atero_cart')) || [];
      document.getElementById('cart-count').innerText = cart.length;
    }
    updateCartCount();
  </script>

</body>
</html>
