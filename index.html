<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATERO - Master your climate</title>
  <meta name="description" content="Sophisticated thermoregulatory clothing crafted for the modern professional. Invisible tech, impeccable tailoring."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    
    /* This code hides the scrollbar but keeps the swipe functionality */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#" class="text-2xl font-semibold text-gray-900">
        <img src="images/logo.png" alt="ATERO Logo" class="h-10 w-auto">
      </a>
      <div class="hidden md:flex space-x-10 text-sm font-medium uppercase tracking-wider">
        <a href="#home" class="hover:text-gray-500 transition">Home</a>
        <a href="#collections" class="hover:text-gray-500 transition">Collections</a>
        <a href="#about" class="hover:text-gray-500 transition">About</a>
        <a href="#contact" class="hover:text-gray-500 transition">Contact</a>
      </div>
    </div>
  </nav>

  <section id="home" class="min-h-screen flex items-center bg-cover bg-center relative" style="background-image: url('images/nightwear-2.jpg');">
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="relative max-w-5xl mx-auto px-6 text-center text-white">
      <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Master your climate</h1>
      <p class="text-xl md:text-2xl mb-10 max-w-3xl mx-auto">Sophisticated thermoregulatory clothing crafted for the modern professional. Invisible tech, impeccable tailoring.</p>
      <a href="#collections" class="inline-block bg-white text-gray-900 font-semibold uppercase tracking-wider py-4 px-12 hover:bg-gray-200 transition">View Collections</a>
    </div>
  </section>

  <section id="collections" class="py-24 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl md:text-5xl font-bold text-center mb-4">Our Collections</h2>
      <p class="text-center text-gray-600 max-w-2xl mx-auto">Swipe to explore our exclusive and elegant nightwear pieces.</p>

      <div class="mt-12 flex overflow-x-auto snap-x snap-mandatory gap-6 pb-8 w-full no-scrollbar">
        
        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-1.jpg" alt="Nightwear 1" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-2.jpg" alt="Nightwear 2" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-3.jpg" alt="Nightwear 3" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-4.jpg" alt="Nightwear 4" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-5.jpg" alt="Nightwear 5" class="w-full h-[28rem] object-cover">
        </div>
        
        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-6.jpg" alt="Nightwear 6" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-7.jpg" alt="Nightwear 7" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-8.jpg" alt="Nightwear 8" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-9.jpg" alt="Nightwear 9" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-10.jpg" alt="Nightwear 10" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-11.jpg" alt="Nightwear 11" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-12.jpg" alt="Nightwear 12" class="w-full h-[28rem] object-cover">
        </div>

        <div class="snap-center shrink-0 w-80 rounded-lg overflow-hidden shadow-md">
          <img src="images/nightwear-13.jpg" alt="Nightwear 13" class="w-full h-[28rem] object-cover">
        </div>

      </div>
    </div>
  </section>

</body>
</html>
